spring.application.name=hotel-reservation-api

#PostgreSQLへの接続設定
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/hotel
spring.datasource.username=hotel_user
spring.datasource.password=${DB_PASSWORD}

server.port=8081

# Entityの定義に合わせてDBのテーブル構造を更新する
spring.jpa.hibernate.ddl-auto=update